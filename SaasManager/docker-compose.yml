version: '3.8'

services:
  saasmanager:
    image: saasmanager-saasmanager:18
    build:
      context: ..
      dockerfile: SaasManager/Dockerfile
    container_name: saasmanager-web
    environment:
      - ConnectionStrings__SaasManagerDb=Host=192.168.50.118;Database=saas_manager_db;Username=osman;Password=CHANGE_ME
      - ApplicationUrl=https://localhost:5001
      - CERT_PATH=/var/etc/certs/certificate.der
      - CERT_KEY_PATH=/var/etc/certs/private.p12
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:5001
    ports:
      - "5001:5001"
    volumes:
      - /workspace/webapp_ssl:/var/etc/certs:ro
    networks:
      - saasmanager-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  saasmanager-network:
    driver: bridge