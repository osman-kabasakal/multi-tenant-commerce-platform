<div class="relative overflow-hidden" [style]="getGradientStyle()">
  <!-- Background Animation -->
<!--  <div class="absolute inset-0 bg-pattern opacity-8" [class.animate-pulse]="true"></div>-->

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24 lg:py-32">
    <div class="text-center space-y-8">
      <!-- Main Heading -->
      <h1 class="text-4xl md:text-5xl lg:text-7xl font-extrabold tracking-tight"
          [style]="{'color': colorPalette.text.heroTitle}">
        <span class="block">Dijital Dönüşümün</span>
        <span class="block mt-2" [style]="getTitleGradientStyle()">
              Tam Zamanı
            </span>
      </h1>

      <!-- Subheading -->
      <p class="mt-6 max-w-3xl mx-auto text-xl sm:text-2xl leading-relaxed"
         [style]="{'color': colorPalette.text.subtitle}">
        Büyük marketlerle rekabet edin. Online siparişler, kurye yönetimi ve stok takibi - hepsi tek platformda.
      </p>

      <!-- Feature Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12 max-w-5xl mx-auto">
        @for(feature of features; track feature.title){
          <div
            class="rounded-xl p-6 transform transition-all duration-300 hover:scale-105"
            [style]="getCardStyle()">
            <fa-icon [icon]="feature.icon" [class]="'text-3xl mb-4'" [style]="{'color': colorPalette.default.accent}"></fa-icon>

            <h3 class="font-bold text-lg" [style]="{'color': colorPalette.card.text}">
              {{feature.title}}
            </h3>
            <p class="mt-2" [style]="{'color': colorPalette.card.text}">
              {{feature.description}}
            </p>
          </div>
        }
      </div>

      <!-- CTA Buttons -->
      <div class="mt-12 flex flex-col sm:flex-row gap-4 justify-center">
        <button routerLink="/register"
                class="inline-flex items-center px-8 py-4 rounded-full font-bold text-lg transition-all transform hover:scale-105 shadow-lg"
                [style]="getPrimaryButtonStyle()">
          15 Gün Ücretsiz Deneyin
          <i class="fas fa-arrow-right ml-2"></i>
        </button>
        <button (click)="watchDemo()"
                class="inline-flex items-center px-8 py-4 rounded-full font-bold text-lg transition-all shadow-lg"
                [style]="getSecondaryButtonStyle()">
          Demo İzleyin
        </button>
      </div>
    </div>
  </div>
</div>
