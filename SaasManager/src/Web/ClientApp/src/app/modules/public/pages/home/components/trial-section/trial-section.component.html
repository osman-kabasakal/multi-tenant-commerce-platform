<div class="relative overflow-hidden bg-gradient-to-br from-white to-blue-50 py-16 md:py-24">
  <!-- Decorative background elements -->
  <div class="absolute inset-0 bg-grid-slate-100 [mask-image:linear-gradient(0deg,white,rgba(255,255,255,0.6))] -z-10"></div>
  <div class="absolute -top-24 -left-20 w-72 h-72 bg-purple-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
  <div class="absolute -bottom-24 -right-20 w-72 h-72 bg-blue-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="text-center">
      <div class="inline-block">
            <span class="inline-flex items-center px-4 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-800 mb-6">
              Ücretsiz Deneme
            </span>
      </div>

      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-6 tracking-tight">
        15 Gün Boyunca
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
              Ücretsiz Deneyin
            </span>
      </h2>

      <div class="mt-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8 backdrop-blur-sm bg-white/80 transform transition-all hover:scale-105">
          <!-- Centered list container -->
          <div class="flex justify-center">
            <ul class="space-y-6 mb-8 inline-block text-left">
              @for(feature of features; track feature){
                <li class="flex items-center gap-4 text-gray-700 whitespace-nowrap">
                  <svg class="h-6 w-6 flex-shrink-0 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <span class="text-lg">{{ feature }}</span>
                </li>
              }

            </ul>
          </div>

          <p class="text-lg text-gray-600 mb-8">
            Kredi kartı gerektirmeden, tüm özellikleriyle platformumuzu 15 gün boyunca ücretsiz test edin.
          </p>

          <button class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform transition-all hover:scale-105">
            Hemen Başlayın
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
