<div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl mx-auto p-4">
  <div *ngFor="let plan of plans"
       [class.border-primary]="selectedPlanId === plan.id"
       [class.shadow-xl]="selectedPlanId === plan.id"
       [class.scale-105]="selectedPlanId === plan.id"
       class="relative h-full rounded-2xl border-2 hover:border-primary bg-white transition-all duration-300 hover:shadow-xl hover:scale-105 group">

    <div *ngIf="plan.trialDays > 0"
         class="absolute -top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-full font-semibold shadow-lg">
      {{ plan.trialDays }} Gün Ücretsiz
    </div>

    <div class="p-8 flex flex-col h-full">
      <div class="flex-grow">
        <h3 class="text-2xl font-bold text-gray-800 mb-2">{{ plan.name }}</h3>
        <p class="text-gray-600">{{ plan.description }}</p>

        <div class="mt-6 flex items-baseline">
          <span class="text-4xl font-bold text-gray-900">₺{{ plan.price }}</span>
          <span class="text-xl text-gray-500 ml-2">/ay</span>
        </div>

        <hr class="my-6 border-gray-200">

        <ul class="space-y-4">
          <li *ngFor="let feature of plan.features"
              class="flex items-center text-gray-700">
            <div class="flex-shrink-0 w-5 h-5 mr-3">
              <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <span>{{ feature }}</span>
          </li>
        </ul>
      </div>

      <div class="mt-8 pt-6 border-t border-gray-100">
        <button (click)="selectPlan(plan.id)"
                [class.bg-cyan-400]="selectedPlanId === plan.id"
                [class.bg-gray-800]="selectedPlanId !== plan.id"
                [class.hover:bg-primary]="selectedPlanId !== plan.id"
                class="w-full py-4 px-6 rounded-xl text-white font-semibold text-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg">
          {{ selectedPlanId === plan.id ? 'Seçili Plan' : 'Planı Seç' }}
        </button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading"
     class="flex items-center justify-center h-64">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
</div>

<div *ngIf="error"
     class="p-4 bg-red-50 rounded-lg text-red-800 max-w-2xl mx-auto mt-4">
  <div class="flex items-center">
    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
    </svg>
    <p>{{ error }}</p>
  </div>
</div>
