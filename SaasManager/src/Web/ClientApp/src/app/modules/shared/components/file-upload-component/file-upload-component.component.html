<div class="file-upload">
  <label class="block">{{ label }}</label>
  <div
    class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md"
    [class.border-blue-500]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="space-y-1 text-center">
      <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="flex text-sm text-gray-600">
        <label class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500">
          <span>Upload a file</span>
          <input
            type="file"
            class="sr-only"
            [accept]="accept"
            [multiple]="multiple"
            (change)="onFileSelected($event)"
          >
        </label>
        <p class="pl-1">or drag and drop</p>
      </div>
      <p class="text-xs text-gray-500">{{ fileHint }}</p>
    </div>
  </div>

  <div *ngIf="selectedFiles.length > 0" class="mt-3">
    <div *ngFor="let file of selectedFiles; let i = index" class="flex items-center justify-between text-sm">
      <div class="flex items-center">
        <svg class="flex-shrink-0 h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
        </svg>
        <span class="ml-2 text-gray-700">{{ file.name }} ({{ (file.size / 1024).toFixed(2) }} KB)</span>
      </div>
      <button
        type="button"
        class="text-red-500 hover:text-red-700"
        (click)="removeFile(i)"
      >
        Remove
      </button>
    </div>
  </div>
</div>
