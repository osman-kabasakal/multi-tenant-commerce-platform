name: Verify source and local demo
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify asset and license inventory
        run: python3 scripts/asset_inventory.py --check
      - name: Reject private and generated files
        run: python3 scripts/check_public_source.py
      - name: Install pinned Gitleaks with checksum verification
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '/tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan only the publishable snapshot
        run: |
          mkdir /tmp/public-source
          git archive HEAD | tar -x -C /tmp/public-source
          /tmp/gitleaks-bin/gitleaks dir /tmp/public-source --config .gitleaks.toml --redact --no-banner
  local-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SaasManager/src/Web/ClientApp/package-lock.json
      - name: Check local encryption boundaries
        working-directory: Ecommerce
        run: dotnet test ../tests/LocalDemo.Tests/LocalDemo.Tests.csproj --nologo
      - name: Bootstrap fixed local tenants
        run: python3 scripts/demo.py up
      - name: Check tenant and authentication boundaries
        run: python3 scripts/demo.py smoke
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: .local/logs/build-*.log
          retention-days: 3
      - name: Stop only this demo
        if: always()
        run: python3 scripts/demo.py stop

  android-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the verified Flutter 3.44.6 revision
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ee80f08bbf97172ec030b8751ceab557177a34a6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore locked mobile dependencies
        working-directory: Platforms/store_user_app
        run: flutter pub get --enforce-lockfile
      - name: Check Dart errors (existing warnings are documented)
        working-directory: Platforms/store_user_app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build local Android demo
        working-directory: Platforms/store_user_app
        run: >-
          flutter build apk --debug --flavor demo --split-per-abi --target-platform android-arm64
          --dart-define=LOCAL_DEMO=true --dart-define=STORE_URL=http://127.0.0.1:18090
          --dart-define=APP_TITLE=CommerceDemo --dart-define=PACKAGE_NAME_ANDROID=dev.commerce.demo
