name: Verify source and local demo
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify asset and license inventory
        run: python3 scripts/asset_inventory.py --check
      - name: Reject private and generated files
        run: |
          python3 scripts/check_public_source.py
          python3 -m unittest discover -s scripts -p test_public_source.py -v
      - name: Verify cloud-free tenant Android build boundaries
        run: python3 -m unittest discover -s scripts -p test_mobile_android.py -v
      - name: Verify iOS tenant, signing policy and Mac preflight without Apple credentials
        run: python3 -m unittest discover -s scripts -p 'test_mobile_ios*.py' -v
      - name: Verify generated Production configuration and identity ownership fences
        run: python3 -m unittest discover -s scripts -p 'test_production_*.py' -v
      - name: Install pinned Gitleaks with checksum verification
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '/tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan only the publishable snapshot
        run: |
          mkdir /tmp/public-source
          git archive HEAD | tar -x -C /tmp/public-source
          /tmp/gitleaks-bin/gitleaks dir /tmp/public-source --config .gitleaks.toml --redact --no-banner
  local-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SaasManager/src/Web/ClientApp/package-lock.json
      - name: Verify complete plugin inventory and real BuildType/BaseDir mapping
        run: python3 scripts/test_tenant_plugins.py
      - name: Check local encryption boundaries
        working-directory: Ecommerce
        run: dotnet test ../tests/LocalDemo.Tests/LocalDemo.Tests.csproj --nologo
      - name: Verify portable provisioning ownership and public readiness contracts
        run: dotnet test tests/Portable.Provisioning.Tests/Portable.Provisioning.Tests.csproj -c Release --nologo
      - name: Verify Google provisioning contracts without cloud credentials
        run: dotnet test tests/Google.Provisioning.Tests/Google.Provisioning.Tests.csproj -c Release --nologo
      - name: Verify customer token password and account checks
        run: dotnet test tests/Customer.Token.Tests/Customer.Token.Tests.csproj -c Release --nologo
      - name: Verify storefront form and JSON model binding
        run: dotnet test tests/Storefront.Binding.Tests/Storefront.Binding.Tests.csproj -c Release --nologo
      - name: Verify tenant notification routing and consent
        run: dotnet test tests/Notifications.Tests/Notifications.Tests.csproj -c Release --nologo
      - name: Build the cloud and Mac release tools without cloud credentials
        run: |
          dotnet build tools/Platform.Cloud/Platform.Cloud.csproj -c Release --nologo
          dotnet build tools/Platform.Ios.Worker/Platform.Ios.Worker.csproj -c Release --nologo
      - name: Verify gateway tenant isolation, proxy trust and real YARP transports
        run: dotnet test tests/Gateway.Tests/Gateway.Tests.csproj -c Release --nologo
      - name: Verify portable card and file providers with owner isolation
        working-directory: SaasManager
        run: dotnet test ../tests/Portable.Services.Tests/Portable.Services.Tests.csproj -c Release --nologo
      - name: Verify SaaS queries without runtime mapping dependencies
        working-directory: SaasManager
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj -c Release --nologo
      - name: Check business registration security
        working-directory: SaasManager
        run: dotnet test ../tests/Registration.Security.Tests/Registration.Security.Tests.csproj -c Release --nologo
      - name: Verify complete installer artifacts and private runtime file exclusions
        run: python3 scripts/smoke_publish_boundaries.py
      - name: Verify fresh Production database bootstrap and read-only runtime startup
        run: python3 scripts/smoke_database_bootstrap.py
      - name: Verify sequential tenant tasks and expiring MongoDB leases
        run: python3 scripts/smoke_tenant_tasks.py
      - name: Verify distributed notifications with real Redis and WebSockets
        run: python3 scripts/smoke_signalr.py
      - name: Verify durable order notifications, tenant isolation and process recovery
        run: python3 scripts/smoke_order_notifications.py
      - name: Verify durable readiness mail and the independent SMTP worker
        run: python3 scripts/smoke_readiness_email.py
      - name: Bootstrap local services and onboarding worker
        run: python3 scripts/demo.py up
      - name: Verify distributed secret storage
        run: python3 scripts/test_distributed_security.py
      - name: Verify cross-process payment locking and encrypted receipt recovery
        working-directory: SaasManager
        run: dotnet run --project ../tests/Payments.Integration/Payments.Integration.csproj -c Release -- ../.local/saas.json
      - name: Check durable tenant provisioning and worker recovery
        run: dotnet run --project tests/Provisioning.Integration/Provisioning.Integration.csproj -c Release -- .local/saas.json
      - name: Build tenant worker with shared security
        working-directory: TenantManager
        run: dotnet build TenantManager.csproj -c Release --nologo
      - name: Verify real Production installer resources and ingress readiness gate
        run: python3 scripts/smoke_portable_worker.py
      - name: Verify Production SaaS enrollment and public HTTPS tenant runtime
        run: python3 scripts/smoke_portable_deployment.py --saas-enrollment
      - name: Verify public tenant readiness and database routing
        run: python3 scripts/smoke_readiness.py
      - name: Provision two new trial businesses through real OIDC
        run: python3 scripts/smoke_onboarding.py
      - name: Verify private SaaS uploads and cross-process downloads
        run: python3 scripts/smoke_storage.py
      - name: Verify Azure-free Production SaaS over HTTPS and real OIDC
        run: python3 scripts/smoke_portable_saas.py
      - name: Check tenant and authentication boundaries
        run: python3 scripts/demo.py smoke
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            .local/logs/build-*.log
            .local/readiness-email-*/fixture.log
            .local/database-bootstrap-*/fixture.log
          include-hidden-files: true
          retention-days: 3
      - name: Stop only this demo
        if: always()
        run: python3 scripts/demo.py stop

  android-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reserve disk space on the disposable Android runner
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # This job uses Java/Android only. Remove unrelated hosted-image
          # toolchains and old NDKs; Gradle installs our pinned NDK below.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          python3 - <<'PYTHON'
          import shutil
          free = shutil.disk_usage('.').free / 1024**3
          print(f'Android runner free disk: {free:.1f} GiB')
          assert free >= 20, 'Android CI requires at least 20 GiB free before SDK installation'
          PYTHON
      - name: Install and verify the pinned Android SDK and NDK before Gradle
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-31" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" && \
              test -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          test -s "$ANDROID_HOME/platforms/android-31/android.jar"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          python3 - <<'PYTHON'
          import os, pathlib, re
          source = pathlib.Path(os.environ['ANDROID_HOME']) / 'ndk/28.2.13676358/source.properties'
          assert re.search(r'^Pkg\.Revision\s*=\s*28\.2\.13676358\s*$', source.read_text(), re.MULTILINE), 'Pinned NDK metadata is missing or inconsistent'
          PYTHON
      - name: Bound Gradle memory for the private hosted runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/commerce-gradle"
          cat > "$RUNNER_TEMP/commerce-gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/commerce-gradle" >> "$GITHUB_ENV"
      - name: Install the verified Flutter 3.44.6 revision
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ee80f08bbf97172ec030b8751ceab557177a34a6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore locked mobile dependencies
        working-directory: Platforms/store_user_app
        run: flutter pub get --enforce-lockfile
      - name: Verify native Firebase identity belongs to the selected tenant
        working-directory: Platforms/store_user_app
        run: flutter test --no-pub test/core/config/tenant_firebase_identity_test.dart test/core/services/apns_notification_bridge_test.dart
      - name: Check Dart errors (existing warnings are documented)
        working-directory: Platforms/store_user_app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build local Android demo
        working-directory: Platforms/store_user_app
        shell: bash
        run: |
          flutter build apk --debug --flavor demo --split-per-abi --target-platform android-arm64 \
            --dart-define=LOCAL_DEMO=true --dart-define=STORE_URL=http://127.0.0.1:18090 \
            --dart-define=APP_TITLE=CommerceDemo --dart-define=PACKAGE_NAME_ANDROID=dev.commerce.demo &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            free -m
            df -h .
            sleep 30
          done
          wait "$build_pid"
      - name: Verify real tenant Firebase and Crashlytics Android resources
        run: python3 scripts/smoke_mobile_android_profile.py

  mobile-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned native Android fixture tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Verify encrypted signing keys and independent mobile worker recovery
        run: python3 scripts/smoke_android_release.py
      - name: Preserve private native fixture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-worker-diagnostics
          path: .local/android-release-integration-*/fixture.log
          include-hidden-files: true
          retention-days: 3


  ios-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the pinned Xcode project editor
        run: gem install xcodeproj --version 1.27.0 --no-document
      - name: Verify actual tenant Xcode target graph with synthetic SDK configuration
        run: |
          python3 scripts/smoke_mobile_ios.py
          python3 scripts/smoke_mobile_ios.py --push-transport Apns
      - name: Preserve synthetic iOS project diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-diagnostics
          path: |
            .local/ios-probe-*/prepare.log
            .local/ios-probe-*/signing-project.log
          include-hidden-files: true
          retention-days: 3

  ios-native-signature:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real iPhone Mach-O metadata and reject a non-Apple signature
        run: python3 scripts/smoke_ios_signature.py
      - name: Preserve synthetic native signature diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-signature-diagnostics
          path: .local/ios-signature-probe-*/fixture.log
          include-hidden-files: true
          retention-days: 3
