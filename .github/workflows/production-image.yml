name: Verify Linux production runtime image
on:
  pull_request:
    paths:
      - 'Ecommerce/**'
      - 'SaasManager/**'
      - 'TenantManager/**'
      - 'Shared/**'
      - 'tools/Platform.Gateway/**'
      - 'tools/Platform.Bootstrap/**'
      - 'tools/Platform.RuntimeProbe/**'
      - 'infra/production/**'
      - 'scripts/production*.py'
      - 'scripts/smoke_production_compose.py'
      - 'scripts/portable_saas_enrollment.py'
      - 'scripts/fixture_identity_mail.py'
      - 'tests/Browser.Acceptance/**'
      - 'scripts/smoke_docker_context.py'
      - 'scripts/smoke_production_image.py'
      - '.dockerignore'
      - '.github/workflows/production-image.yml'
  push:
    branches: [main, master, 'codex/**']
    paths:
      - 'Ecommerce/**'
      - 'SaasManager/**'
      - 'TenantManager/**'
      - 'Shared/**'
      - 'tools/Platform.Gateway/**'
      - 'tools/Platform.Bootstrap/**'
      - 'tools/Platform.RuntimeProbe/**'
      - 'infra/production/**'
      - 'scripts/production*.py'
      - 'scripts/smoke_production_compose.py'
      - 'scripts/portable_saas_enrollment.py'
      - 'scripts/fixture_identity_mail.py'
      - 'tests/Browser.Acceptance/**'
      - 'scripts/smoke_docker_context.py'
      - 'scripts/smoke_production_image.py'
      - '.dockerignore'
      - '.github/workflows/production-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk on the disposable Docker builder
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          python3 - <<'PYTHON'
          import shutil
          free = shutil.disk_usage('.').free / 1024**3
          print(f'Production image runner free disk: {free:.1f} GiB')
          assert free >= 20, 'The complete multi-SDK container build requires at least 20 GiB free'
          PYTHON
      - name: Verify the actual private Docker context boundary
        run: python3 scripts/smoke_docker_context.py
      - name: Build every server component from the committed source snapshot
        run: python3 scripts/production_image.py build --image commerce-platform:ci
      - name: Execute the complete offline Linux runtime package as non-root
        run: python3 scripts/production_image.py verify --image commerce-platform:ci
      - name: Initialize fresh Production databases from the real container
        run: python3 scripts/smoke_production_image.py --image commerce-platform:ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Browser.Acceptance/package-lock.json
      - name: Install the pinned browser and private-profile certificate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/Browser.Acceptance
          cd tests/Browser.Acceptance
          npx --no-install playwright install --with-deps firefox
      - name: Verify a complete Compose rollout, real Angular enrollment and preserved-state restart
        run: python3 scripts/smoke_production_compose.py --image commerce-platform:ci --browser
      - name: Preserve source context diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-context-diagnostics
          path: |
            .local/logs/docker-source-context.log
            .local/logs/production-image-bootstrap.log
            .local/production-compose-*/fixture.log
            .local/production-compose-*/deployment.log
            .local/production-compose-*/browser-diagnostics.json
            output/playwright/*/*.png
          include-hidden-files: true
          retention-days: 3
