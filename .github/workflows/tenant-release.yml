name: Verify real tenant Flutter release
on:
  pull_request:
    paths:
      - 'Platforms/**'
      - 'scripts/mobile_android.py'
      - 'scripts/test_mobile_android.py'
      - 'scripts/smoke_flutter_release.py'
      - '.github/workflows/tenant-release.yml'
  push:
    branches: [main, master, 'codex/**']
    paths:
      - 'Platforms/**'
      - 'scripts/mobile_android.py'
      - 'scripts/test_mobile_android.py'
      - 'scripts/smoke_flutter_release.py'
      - '.github/workflows/tenant-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tenant-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reserve disk on this disposable hosted runner
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          python3 - <<'PYTHON'
          import shutil
          free = shutil.disk_usage('.').free / 1024**3
          print(f'Synthetic tenant release runner free disk: {free:.1f} GiB')
          assert free >= 20, 'The isolated Flutter release probe requires at least 20 GiB free'
          PYTHON
      - name: Install pinned Android verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Install the verified Flutter revision
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ee80f08bbf97172ec030b8751ceab557177a34a6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and verify a complete signed tenant Flutter APK without cloud publication
        run: python3 scripts/smoke_flutter_release.py
      - name: Preserve only synthetic build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-flutter-release-diagnostics
          path: .local/flutter-release-*/fixture.log
          include-hidden-files: true
          retention-days: 3
