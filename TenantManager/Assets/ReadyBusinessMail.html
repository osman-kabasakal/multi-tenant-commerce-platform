<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famizyo yerel E-ticaret Platformuna Hoş Geldiniz</title>
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
    <!-- Header -->
    

    <!-- Main Content -->
    <div style="padding: 30px; color: #333333;">
        <h1 style="color: #1e40af; margin-bottom: 20px;">Hoş Geldiniz!</h1>

        <p style="font-size: 16px; line-height: 1.5;">
            Merhaba {FirstName} {Lastname},
        </p>

        <p style="font-size: 16px; line-height: 1.5;">
            Kurulum işleleriniz tamamlanmıştır.
        </p>

        <div style="background-color: #f8fafc; border-left: 4px solid #2563eb; padding: 15px; margin: 25px 0;">
            <h2 style="color: #1e40af; margin: 0 0 10px 0;">Hesap Bilgileriniz</h2>
            <p style="margin: 0;">
                İşletme Adı: {StoreName}<br>
                Email: {OwnerEmail}<br>
                Hesap Türü: {Role} <br/>
                Yönetim Pane Linki: <a href="{WarehouseUrl}">{WarehouseUrl}</a><br/>
<!--                Android Uygulama İndirme Linki: <a href="{AndroidAppUrl}">{AndroidAppUrl}</a><br/>-->
<!--                Ios Uygulama İndirme Linki: <a href="{IosAppUrl}">{IosAppUrl}</a><br/>-->
<!--                Pos Uygulama İndirme Linki (Windows): <a href="{PosAppUrlWindows}">{PosAppUrlWindows}</a><br/>-->
<!--                Pos Uygulama İndirme Linki (Linux): <a href="{PosAppUrlLinux}">{PosAppUrlLinux}</a><br/>-->
<!--                Pos Uygulama İndirme Linki (Macos): <a href="{PosAppUrlIos}">{PosAppUrlIos}</a><br/>-->
            </p>
        </div>

    </div>

    <!-- Footer -->
    
</div>
</body>

</html>
