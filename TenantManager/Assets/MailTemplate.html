<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famizyo yerel E-ticaret Platformuna Hoş Geldiniz</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
    
    <!-- Header -->
    <div style="background-color: #2563eb; padding: 20px; text-align: center;">
        <img src="https://sanal-donusum.commerce.test/images/logo.svg" alt="Famizyo" style="max-height: 60px;">
    </div>
    <!-- End Header -->

    <!-- Main Content -->
    
    <!-- Footer -->
    <div style="background-color: #f8fafc; padding: 20px; text-align: center; font-size: 14px; color: #64748b;">
        <p style="margin: 0 0 10px 0;">
            Bu email {CompanyName} hesabının sahibi olarak gönderilmiştir.
        </p>
        <p style="font-size: 16px; line-height: 1.5;">
            Herhangi bir sorunuz olursa, destek ekibimiz size yardımcı olmaktan mutluluk duyacaktır. Destek için <a
                href="mailto:[SUPPORT_EMAIL]" style="color: #2563eb; text-decoration: none;">[SUPPORT_EMAIL]</a>
            adresine email gönderebilirsiniz.
        </p>
        <div style="margin: 15px 0;">
            <a href="[FACEBOOK_URL]" style="text-decoration: none; margin: 0 10px;">
                <img src="[FACEBOOK_ICON]" alt="Facebook" style="width: 24px;">
            </a>
            <a href="[TWITTER_URL]" style="text-decoration: none; margin: 0 10px;">
                <img src="[TWITTER_ICON]" alt="Twitter" style="width: 24px;">
            </a>
            <a href="[INSTAGRAM_URL]" style="text-decoration: none; margin: 0 10px;">
                <img src="[INSTAGRAM_ICON]" alt="Instagram" style="width: 24px;">
            </a>
        </div>
        <p style="margin: 0; font-size: 12px;">
            © {YEAR} [COMPANY_NAME] yerel E-ticaret Platformu. Tüm hakları saklıdır.
        </p>
    </div>
    <!-- End Footer -->
</div>
</body>
</html>
