name: store_user_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nb_utils:
    path: ../modules/nb_utils/
  flutter_jailbreak_detection:
    path: ../modules/flutter_jailbreak_detection/

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  auto_route: ^10.0.1
  get_it: ^8.0.3
  injectable: ^2.5.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  logger: ^2.5.0
  riverpod_annotation: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  json_annotation: ^4.9.0
  webview_flutter: ^4.10.0
  geolocator: ^13.0.3
  latlong2: ^0.9.1
  flutter_map: ^8.1.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  freezed_annotation: ^2.4.4
  retrofit: ^4.4.2
  jwt_decoder: ^2.0.1
  flutter_cache_manager: ^3.4.1
  http: ^1.3.0
  clock: ^1.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.6.1
  gap: ^3.0.1
  flextras: ^1.0.0
  flutter_native_splash: ^2.4.5
  dots_indicator: ^4.0.1
  intl: ^0.20.2
  dropdown_button2: ^2.3.9
  skeletonizer: ^2.1.3
  google_fonts: ^6.3.3
  uuid: ^4.5.1
  synchronized: ^3.3.1
  visibility_detector: ^0.4.0+2
  flutter_hooks: ^0.21.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  file_picker: ^9.2.1
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  crypto: ^3.0.6
  device_info_plus: ^11.3.3
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0
  geocoding: ^3.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  google_api_availability: ^5.0.1
  connectivity_plus: ^7.1.0
  package_info_plus: ^8.3.0
  flutter_launcher_icons: ^0.14.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  sortedmap: ^0.5.4
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  auto_route_generator: ^10.0.1
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  custom_lint: ^0.7.1
  riverpod_generator: ^2.6.4
  riverpod_lint: ^2.6.4
  freezed: ^2.5.8
  retrofit_generator: ^9.1.9
  flutter_flavorizr: ^2.3.0
  integration_test:
    sdk: flutter


targets:
  $default:
    builders:
      json_serializable:
        enabled: true
      freezed:
        generate_for:
          include:
            - lib/**/*.dart
        enabled: true
        options: {}
      retrofit_generator:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
        options: {}
    dependencies:
      - freezed
      - retrofit_generator
    orders:
      - freezed:freezed
      - json_serializable:json_annotation
      - retrofit_generator:retrofit

analyzer:
  plugins:
    - custom_lint


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 800
        - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/urbanist/Urbanist-ExtraBold.ttf
          weight: 900

platforms:
  android: